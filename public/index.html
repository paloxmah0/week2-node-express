<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 2 Express API</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>My Week 2 API</h1>
  <p>This page is served statically by Express from the <code>public</code> folder.</p>
  <h2>Endpoints</h2>
  <ul>
    <li><code>GET /</code> – welcome message</li>
    <li><code>POST /user</code> – send <code>{name, email}</code> and get a greeting</li>
    <li><code>GET /user/:id</code> – view a user profile</li>
  </ul>
</body>
</html>
